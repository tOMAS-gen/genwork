"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "npm install"
run_mode = "nonconcurrent"

[scripts.run.dev]
available_in = [ "local" ]
command = "GENSTOCK_BASE_URL=${GENSTOCK_BASE_URL:-http://127.0.0.1:8110} bash scripts/mobile-dev.sh web"
default = true
icon = "play"

[scripts.run.mobile_setup]
available_in = [ "local" ]
command = "bash scripts/mobile-dev.sh setup"
icon = "database"

[scripts.run.android]
available_in = [ "local" ]
command = "bash scripts/mobile-dev.sh android"
icon = "smartphone"

[scripts.run.mobile_evidence]
available_in = [ "local" ]
command = "node scripts/mobile-evidence.mjs"
icon = "images"

[scripts.run.mobile_check]
available_in = [ "local" ]
command = "node scripts/mobile-check.mjs"
icon = "test-tube"
